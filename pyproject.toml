[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
  \.git
  | \.venv
  | build
  | dist
  | .venv
)/
'''

[tool.isort]
profile = "black"
line_length = 88

[tool.pytest.ini_options]
markers = [
    "integration: real InsightFace model + corpus DB (auto-skipped; run with -m integration)",
]
